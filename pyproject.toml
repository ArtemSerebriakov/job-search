[project]
name = "job-search"
version = "0.1.0"
description = "Daily AI job digest: collect postings, hard-filter, rank against the CV, score with Claude, email the top 10"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
jobsearch = "job_search.cli:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
